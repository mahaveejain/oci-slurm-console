[Service]
# Suno mounts shared storage at /home; /config is not present.
Environment="SLURM_CONSOLE_NCCL_LOG_DIR=/home/ubuntu/slurm-console/logs/slurm-console-nccl"
Environment="SLURM_CONSOLE_GPU_FRYER_LOG_DIR=/home/ubuntu/slurm-console/logs/slurm-console-gpu-fryer"
Environment="SLURM_CONSOLE_GPU_TEST_LOG_DIR=/home/ubuntu/slurm-console/logs/gpu-tests"
# Keep ProtectHome=read-only while permitting test logs and working files.
ReadWritePaths=/home/ubuntu/slurm-console/logs/slurm-console-nccl /home/ubuntu/slurm-console/logs/slurm-console-gpu-fryer /home/ubuntu/slurm-console/logs/gpu-tests
