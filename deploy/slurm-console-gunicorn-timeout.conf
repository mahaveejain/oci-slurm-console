[Service]
# OCI-HPC lifecycle workflows can take several minutes.  Keep the web worker
# alive long enough to stream their output rather than returning a browser
# network error at Gunicorn's default 30-second timeout.
ExecStart=
ExecStart=/home/ubuntu/slurm-console/.venv/bin/gunicorn --workers 2 --timeout 900 --graceful-timeout 60 --bind 127.0.0.1:8080 --access-logfile - --error-logfile - app:app
